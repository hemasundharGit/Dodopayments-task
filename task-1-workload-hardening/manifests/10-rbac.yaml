apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-api
  namespace: ledger
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-neighbour
  namespace: ledger
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ledger-api-read-config
  namespace: ledger
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ledger-api-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ledger-api-read-config
  namespace: ledger
subjects:
  - kind: ServiceAccount
    name: ledger-api
    namespace: ledger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ledger-api-read-config
