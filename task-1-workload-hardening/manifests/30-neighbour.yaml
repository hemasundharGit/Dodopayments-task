apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-neighbour
  namespace: ledger
  labels:
    app.kubernetes.io/name: ledger-neighbour
    app.kubernetes.io/part-of: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-neighbour
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-neighbour
        app.kubernetes.io/part-of: ledger
    spec:
      serviceAccountName: ledger-neighbour
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: neighbour
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-neighbour
  namespace: ledger
  labels:
    app.kubernetes.io/name: ledger-neighbour
spec:
  selector:
    app.kubernetes.io/name: ledger-neighbour
  ports:
    - name: http
      port: 8080
      targetPort: http
