apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-root-latest-demo
  namespace: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-root-latest-demo
  template:
    metadata:
      labels:
        app: insecure-root-latest-demo
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          securityContext:
            runAsUser: 0
