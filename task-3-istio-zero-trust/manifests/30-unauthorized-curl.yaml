apiVersion: v1
kind: ServiceAccount
metadata:
  name: unauthorized-curl
  namespace: ledger
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: unauthorized-curl
  namespace: ledger
  labels:
    app.kubernetes.io/name: unauthorized-curl
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unauthorized-curl
    spec:
      restartPolicy: Never
      serviceAccountName: unauthorized-curl
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: curlimages/curl:8.8.0
          command:
            - sh
            - -c
            - |
              curl -sv --max-time 5 http://ledger-api.ledger.svc.cluster.local:8080/health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
