apiVersion: batch/v1
kind: Job
metadata:
  name: authorized-curl
  namespace: ledger
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-neighbour
        test-role: authorized-curl
    spec:
      restartPolicy: Never
      serviceAccountName: ledger-neighbour
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: curlimages/curl:8.8.0
          command:
            - sh
            - -c
            - |
              sleep 8
              curl -sS -o /tmp/out -w "%{http_code}\n" http://ledger-api.ledger.svc.cluster.local:8080/health
              cat /tmp/out
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
